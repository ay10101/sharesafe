services:
  - type: web
    name: sharesafe
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: ./data/sharesafe.db
